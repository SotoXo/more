services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    mati-ai:
        profiles: [ai]
        build:
            context: './services/mati-ai'
        environment:
            MATI_AI_TOKEN: '${MATI_AI_TOKEN:-}'
            MATI_AI_MODEL_PROVIDER: '${MATI_AI_MODEL_PROVIDER:-siglip}'
            MATI_AI_VISION_MODEL: '${MATI_AI_VISION_MODEL:-}'
            MATI_AI_MODEL_REVISION: '${MATI_AI_MODEL_REVISION:-main}'
            MATI_AI_DEVICE: '${MATI_AI_DEVICE:-auto}'
            MATI_AI_LOCAL_FILES_ONLY: 'true'
            MATI_AI_OCR_DOWNLOAD_ENABLED: 'false'
            MATI_AI_EXTERNAL_SOURCES_FILE: '${MATI_AI_EXTERNAL_SOURCES_FILE:-/app/config/external-sources.example.json}'
        volumes:
            - 'mati-ai-cache:/cache'
            - './services/mati-ai/config:/app/config:ro'
        networks:
            - sail
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    mati-ai-cache:
        driver: local
